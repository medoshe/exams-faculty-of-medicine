<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>el website – Log in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --bg1:#f7fcfa; --bg2:#d9f2ec; --card:#ffffff; --text:#12263a; --muted:#51606e;
  --brand:#0f9d84; --brand-d:#0b7766; --brand-l:#d9f2ec; --field:#f1f4f5; --line:#d9e0e4;
  --blob:#d9f2ec; --ghost:#b9e3da; --hill1:#14a287; --hill2:#0b7766; --hill3:#2dab94;
  --shadow:0 20px 50px rgba(15,157,132,.15);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; min-height:100dvh; font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--text); background:radial-gradient(circle at 85% 10%,var(--bg2),transparent 45%),var(--bg1);
  background-color:var(--bg1); overflow-x:hidden; display:grid; place-items:center; position:relative;
}
/* brand */
.brand{position:absolute;top:22px;left:28px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;z-index:3}
.brand span{color:var(--brand)}
.brand svg{width:42px;height:42px}
.pop{opacity:0;animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{0%{opacity:0;transform:scale(.3) translateY(14px)}100%{opacity:1;transform:none}}
/* decor */
.blob{position:fixed;border-radius:50%;background:var(--blob);z-index:0;transition:translate .25s ease-out}
.b1{width:160px;height:160px;left:12%;top:25%}
.b2{width:108px;height:108px;right:19%;top:50%}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.illus{position:fixed;left:0;bottom:0;width:min(46vw,740px);z-index:1;pointer-events:none}
.hill-r{position:fixed;right:0;bottom:0;width:min(34vw,640px);z-index:1;pointer-events:none}
/* card */
.wrap{position:relative;z-index:2;width:min(92vw,468px);margin:70px 0 40px}
.card{
  background:var(--card);border-radius:28px;padding:62px 36px 32px;box-shadow:var(--shadow);text-align:center;
  animation:rise .8s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.badge{
  position:absolute;z-index:3;left:50%;top:-47px;margin-left:-47px;width:94px;height:94px;border-radius:50%;
  background:var(--brand-l);display:grid;place-items:center;--d:.35s
}
.badge svg{width:50px;height:50px}
h1{margin:0 0 8px;font-size:40px;font-weight:800;letter-spacing:-.5px}
.sub{margin:0 0 24px;color:var(--muted);line-height:1.6;font-size:17px}
.field{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:6px 10px 6px 8px;margin-bottom:14px;height:58px;
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.field:hover{border-color:var(--brand);transform:translateY(-1px)}
.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
.ico{width:42px;height:42px;border-radius:12px;background:var(--field);display:grid;place-items:center;flex:none;--d:.7s;transition:background .2s,transform .3s}
.field:focus-within .ico{background:var(--brand-l);transform:rotate(-8deg) scale(1.08)}
.ico svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.field:focus-within .ico svg{stroke:var(--brand)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--text)}
.field input::placeholder{color:var(--muted)}
.eye{border:0;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;transition:background .2s,transform .15s}
.eye:hover{background:var(--field);transform:scale(1.1)}
.eye svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.err{min-height:20px;margin:-4px 0 6px;color:#d64545;font-size:14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* buttons */
.btn{
  position:relative;overflow:hidden;width:100%;height:60px;border:0;border-radius:20px;cursor:pointer;
  font:inherit;font-size:18px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--brand),var(--brand-d));
  box-shadow:0 12px 24px color-mix(in srgb,var(--brand) 35%,transparent);
  transition:transform .2s,box-shadow .2s,filter .2s;
}
.btn::before{
  content:"";position:absolute;inset:0;background:radial-gradient(circle 90px at var(--x,50%) var(--y,50%),rgba(255,255,255,.32),transparent);
  opacity:0;transition:opacity .25s
}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 30px color-mix(in srgb,var(--brand) 42%,transparent)}
.btn:hover::before{opacity:1}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible,.ghost:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.btn.loading{pointer-events:none;filter:saturate(.8)}
.btn.loading span{opacity:0}
.btn.loading::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.or{display:flex;align-items:center;gap:14px;margin:26px 0 18px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ghost{
  display:flex;align-items:center;justify-content:center;width:100%;height:58px;border:0;border-radius:18px;background:var(--field);
  color:var(--brand);font:inherit;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer;
  transition:background .2s,color .2s,transform .2s,box-shadow .2s;
}
.ghost:hover{background:var(--brand);color:#fff;transform:translateY(-2px);box-shadow:0 10px 20px color-mix(in srgb,var(--brand) 30%,transparent)}
.ghost:active{transform:scale(.98)}
.logo-hover{transition:transform .4s}
.badge:hover svg{animation:wiggle .6s}
@keyframes wiggle{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
@media (max-width:760px){
  .illus{width:68vw;opacity:.6}.hill-r{width:60vw;opacity:.8}
  .b1{left:4%;top:16%;width:110px;height:110px}.b2{right:6%;top:62%;width:80px;height:80px}
  .brand{left:50%;transform:translateX(-50%);top:16px;font-size:20px;white-space:nowrap}
  .brand svg{width:36px;height:36px}
  .wrap{margin:118px 0 32px}
  h1{font-size:32px}.sub{font-size:15.5px;margin-bottom:20px}
  .card{padding:58px 20px 26px;border-radius:24px}
  .field{height:54px}.ico{width:38px;height:38px}
  .btn{height:56px}.ghost{height:54px}
}
@media (max-width:360px){.brand{font-size:18px}.wrap{width:94vw}h1{font-size:28px}}
@media (hover:none){
  .field:hover,.btn:hover,.ghost:hover,.eye:hover{transform:none}
  .btn:hover{box-shadow:0 12px 24px color-mix(in srgb,var(--brand) 35%,transparent)}
  .btn:hover::before{opacity:0}
  .ghost:hover{background:var(--field);color:var(--brand);box-shadow:none}
  .field:hover{border-color:var(--line)}
  .btn:active{transform:scale(.97)}
  .ghost:active{background:var(--brand);color:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>

<div class="brand">
  <svg class="pop" style="--d:.1s" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 8 2 22l30 14 30-14L32 8Z" fill="#14a287"/>
    <path d="M14 32v10c0 6 8 12 18 12s18-6 18-12V32L32 40 14 32Z" fill="#0b7766"/>
    <path d="M58 25v16" stroke="#0b7766" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="pop" style="--d:.2s">el <span>website</span></div>
</div>

<div class="blob b1"></div>
<div class="blob b2"></div>

<svg class="illus" viewBox="0 0 740 420" preserveAspectRatio="xMinYMax meet" aria-hidden="true">
  <path d="M0 420V268C120 245 300 235 460 300c110 45 190 90 230 120Z" fill="var(--hill1)"/>
  <g>
    <circle cx="265" cy="210" r="105" fill="none" stroke="var(--ghost)" stroke-width="20" opacity=".6"/>
    <line x1="268" y1="170" x2="248" y2="215" stroke="var(--ghost)" stroke-width="10" stroke-linecap="round"/>
    <rect x="70" y="20" width="198" height="250" rx="16" fill="var(--ghost)"/>
    <rect x="90" y="40" width="158" height="230" rx="8" fill="var(--card)" opacity=".75"/>
    <g fill="var(--ghost)">
      <rect x="106" y="62" width="26" height="26" rx="6"/><rect x="146" y="72" width="82" height="7" rx="3.5"/>
      <rect x="106" y="108" width="26" height="26" rx="6"/><rect x="146" y="118" width="82" height="7" rx="3.5"/>
      <rect x="106" y="154" width="26" height="26" rx="6"/><rect x="146" y="164" width="82" height="7" rx="3.5"/>
    </g>
    <rect x="50" y="240" width="224" height="40" rx="6" fill="var(--hill3)" opacity=".7"/>
    <rect x="30" y="278" width="250" height="40" rx="6" fill="var(--hill3)" opacity=".9"/>
  </g>
</svg>
<svg class="hill-r" viewBox="0 0 640 220" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
  <path d="M0 220C40 90 200 10 400 8c120 0 190 14 240 28V220Z" fill="var(--hill3)"/>
</svg>

<main class="wrap">
  <div class="badge pop" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <path d="M32 8 2 22l30 14 30-14L32 8Z" fill="#14a287"/>
      <path d="M14 32v10c0 6 8 12 18 12s18-6 18-12V32L32 40 14 32Z" fill="#0b7766"/>
      <path d="M58 25v16" stroke="#0b7766" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <form class="card" id="form" novalidate>
    <h1>Log in</h1>
    <p class="sub">Welcome back! Please enter your credentials to continue</p>

    <label class="field">
      <span class="ico pop"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
      <input id="user" type="text" placeholder="Username" autocomplete="username">
    </label>

    <label class="field">
      <span class="ico pop" style="--d:.85s"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
      <button type="button" class="eye" id="eye" aria-label="Show password">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </label>

    <div class="err" id="err" role="alert"></div>

    <button class="btn" id="login" type="submit"><span>Log in</span></button>

    <div class="or">or</div>
    <a class="ghost" href="#home" id="home">Back to home</a>
  </form>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
      apiKey: "AIzaSyBoPia2RLbH3oxHvmH2APTUcTxyx3HRGac",
      authDomain: "exams-dfe87.firebaseapp.com",
      projectId: "exams-dfe87",
      storageBucket: "exams-dfe87.firebasestorage.app",
      messagingSenderId: "42103010026",
      appId: "1:42103010026:web:21bcc8b6886efa91239d93",
      measurementId: "G-VW302S6EF9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  (function(){
    var form=document.getElementById('form'),user=document.getElementById('user'),pass=document.getElementById('pass'),
        err=document.getElementById('err'),btn=document.getElementById('login'),card=form;

    document.querySelectorAll('.btn,.ghost').forEach(function(el){
      el.addEventListener('mousemove',function(e){
        var r=el.getBoundingClientRect();
        el.style.setProperty('--x',(e.clientX-r.left)+'px');
        el.style.setProperty('--y',(e.clientY-r.top)+'px');
      });
      el.addEventListener('click',function(e){
        var r=el.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)/4;
        s.className='ripple';s.style.width=s.style.height=d+'px';
        s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
        el.appendChild(s);setTimeout(function(){s.remove()},600);
      });
    });

    var blobs=document.querySelectorAll('.blob');
    document.addEventListener('mousemove',function(e){
      var x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);
      blobs.forEach(function(b,i){var k=(i+1)*14;b.style.translate=(x*k)+'px '+(y*k)+'px'});
    });

    document.getElementById('eye').addEventListener('click',function(){
      var show=pass.type==='password';
      pass.type=show?'text':'password';
      this.setAttribute('aria-label',show?'Hide password':'Show password');
      this.style.opacity=show?.6:1;
    });

    function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem("exam_device_id");
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem("exam_device_id", deviceId);
        }
        return deviceId;
    }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      err.textContent='';
      
      const userInput = user.value.trim();
      const passInput = pass.value.trim();
      const currentDevice = getOrCreateDeviceId();

      if(!userInput || !passInput){
        err.textContent='Please enter your username and password.';
        card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
        (userInput?pass:user).focus();
        return;
      }

      btn.classList.add('loading');

      try {
          const q = query(collection(db, "students"), where("username", "==", userInput));
          const querySnapshot = await getDocs(q);

          if (querySnapshot.empty) {
              btn.classList.remove('loading');
              err.textContent = 'Invalid username or password.';
              card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
              return;
          }

          let studentDoc = null;
          querySnapshot.forEach((docSnap) => {
              studentDoc = { id: docSnap.id, ...docSnap.data() };
          });

          if (studentDoc.password !== passInput) {
              btn.classList.remove('loading');
              err.textContent = 'Invalid username or password.';
              card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
              return;
          }

          const studentRef = doc(db, "students", studentDoc.id);
          if (!studentDoc.deviceId || studentDoc.deviceId === "") {
              await updateDoc(studentRef, { deviceId: currentDevice });
          } else if (studentDoc.deviceId !== currentDevice) {
              btn.classList.remove('loading');
              err.textContent = 'This account is locked to another device!';
              card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
              return;
          }

          // حفظ اسم الطالب والرقم والكورس في الـ localStorage والانتقال التلقائي لصفحة معلومات الحساب
          localStorage.setItem("currentStudentName", studentDoc.username);
          localStorage.setItem("currentStudentId", studentDoc.studentId || studentDoc.id || "2026-MED-001");
          localStorage.setItem("currentStudentCourse", studentDoc.course || "First-Year Medicine");

          err.style.color = '#0f9d84';
          err.textContent = 'Signed in successfully! Opening account...';
          
          setTimeout(function(){
              window.location.href = "dashboard.html#account";
          }, 1000);

      } catch (error) {
          console.error(error);
          btn.classList.remove('loading');
          err.textContent = 'Database connection error. Try again.';
      }
    });

    document.getElementById('home').addEventListener('click',function(e){e.preventDefault()});
  })();
</script>
</body>
</html>
