const $=id=>document.getElementById(id),D="٠١٢٣٤٥٦٧٨٩",ar=n=>String(n).replace(/\d/g,d=>D[d]);

let ans={},flag={},cur=1,pend;
function render(){
  $("qh").textContent="Question "+cur+" of "+N+(Q[cur].w?" (Written)":"")+":";
  $("qt").textContent=Q[cur].t;
  $("opts").innerHTML="";
  const sel=pend!==undefined?pend:ans[cur];
  if(Q[cur].w){const ta=document.createElement("textarea");ta.className="ta";ta.placeholder="Write your answer here...";ta.value=sel||"";ta.oninput=()=>{pend=ta.value.trim()?ta.value:undefined};$("opts").appendChild(ta)}else Q[cur].o.forEach((o,i)=>{
    const l=document.createElement("label");l.className="o";
    l.innerHTML='<input type="radio" name="o"'+(sel===i?" checked":"")+'><span></span>';
    l.lastChild.textContent=L[i]+") "+o;
    l.querySelector("input").onchange=()=>{pend=i};
    $("opts").appendChild(l);
  });
  paint();
}
function paint(){document.querySelectorAll(".s").forEach((b,k)=>{const i=k+1;b.className="s"+(flag[i]?" b":ans[i]!==undefined?" a":"")+(i===cur?" c":"")})}

function modal(text,btns,dir){
  $("bx").dir=dir;$("mt").textContent=text;$("mb").innerHTML="";

  $("m").classList.add("on");

function guard(fn){

}
function go(i){cur=i;pend=undefined;render()}
